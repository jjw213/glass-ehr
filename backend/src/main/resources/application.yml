# 접속정보는 환경변수(.env)로만 받는다. 예시는 backend/.env.example 참고.
spring:
  application:
    name: glass-ehr-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 마이그레이션 스크립트로 관리한다. JPA가 테이블을 만들거나 바꾸지 않는다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${PORT:8080}
