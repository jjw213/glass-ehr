# 접속정보는 환경변수(.env)로만 받는다. 예시는 backend/.env.example 참고.
spring:
  application:
    name: glass-ehr-backend
  config:
    # backend/.env 를 properties 형식으로 읽는다(없으면 무시). 실제 환경변수가 있으면 환경변수가 우선한다.
    # backend/ 에서 실행하면 ./.env, 저장소 루트에서 실행하면 ./backend/.env 가 잡힌다.
    import:
      - optional:file:./.env[.properties]
      - optional:file:./backend/.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 마이그레이션 스크립트로 관리한다. JPA가 테이블을 만들거나 바꾸지 않는다.
      ddl-auto: validate
    # hibernate.jdbc.time_zone은 두지 않는다. 시각 컬럼은 시간대 없는 TIMESTAMP이고 앱이 서울 기준 LocalDateTime을
    # 만들기 때문에 변환 없이 그대로 저장해야 한다. 이 값을 두면 JVM 기본 시간대가 서울이 아닐 때(@SpringBootTest는
    # GlassEhrApplication.main()의 TimeZone.setDefault를 거치지 않음) JPA 저장 값만 시차만큼 밀리고 MyBatis와 어긋난다.
  servlet:
    multipart:
      # 서면합의서 첨부(#27, 앱 한도 glassehr.agreement.max-file-bytes = 10MB)보다 조금 크게 둔다.
      # 한도를 넘으면 앱에서 413 메시지를 주기 위해서다. 사원 CSV(#20)도 이 한도를 쓴다.
      max-file-size: 11MB
      max-request-size: 12MB
  jackson:
    time-zone: Asia/Seoul
    deserialization:
      # 금액·분 단위 정수 필드에 소수(2500000.5)가 오면 잘라 내지 않고 400 으로 거부한다(AGENTS.md: 금액은 원 단위 정수).
      accept-float-as-int: false
  # 로그인 세션(#75 결정, #76 구현). 세션은 Oracle SPRING_SESSION 테이블(V027)에 저장한다. 테이블은 앱이 만들지 않는다.
  session:
    jdbc:
      initialize-schema: never

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${PORT:8080}
  servlet:
    session:
      # 마지막 요청 후 이 시간이 지나면 세션이 끝난다(운영 설정). 끝나면 API 가 401 을 주고 화면은 로그인으로 돌아간다.
      timeout: ${SESSION_IDLE_TIMEOUT:30m}
      cookie:
        name: GHR_SESSION
        http-only: true
        same-site: lax
        # HTTPS 로 서비스하는 운영에서는 true 로 둔다(.env SESSION_COOKIE_SECURE=true).
        secure: ${SESSION_COOKIE_SECURE:false}

# 주민등록번호 컬럼 암호화 키(docs/rrn-design.md). 값은 .env·비밀 저장소로만 넣는다. 비어 있으면 주민등록번호 저장·조회가 거부된다.
glassehr:
  rrn:
    enc-keys: ${RRN_ENC_KEYS:}
    current-key-version: ${RRN_CURRENT_KEY_VERSION:}
    hmac-key: ${RRN_HMAC_KEY:}
  # 근로계약 알림 기간(일). 법정 수치가 아니라 회사 운영 설정이다(이슈 #17 완료 기준 "계약 만료 30일 전").
  # 기간제 사용기간 상한 자체(기간제법 제4조)는 legal_rate FIXED_TERM_MAX_USE_YEARS 에서 읽는다.
  # 이 사업장의 상시근로자 수(명). 법정 수치가 아니라 회사 설정이다(AGENTS.md: 상시근로자 30인 이상 사업장 대상).
  # 규모별 시행일이 다른 조문(근로기준법 제55조 제2항 등)은 legal_rate 의 적용 규모 하한과 이 값을 비교한다.
  workplace:
    regular-headcount: ${WORKPLACE_REGULAR_HEADCOUNT:30}
  contract:
    expiry-alert-days: ${CONTRACT_EXPIRY_ALERT_DAYS:30}
    fixed-term-limit-alert-days: ${CONTRACT_FIXED_TERM_LIMIT_ALERT_DAYS:30}
  # 근로자대표 서면합의서(#27). 만료 예정 알림 기간(일)과 첨부 1건 최대 크기(바이트). 법정 수치가 아니라 운영 설정이다.
  # 첨부 크기를 키우면 spring.servlet.multipart 한도도 함께 키운다.
  agreement:
    expiry-alert-days: ${AGREEMENT_EXPIRY_ALERT_DAYS:30}
    max-file-bytes: ${AGREEMENT_MAX_FILE_BYTES:10485760}
  # 주 52시간 모니터링(#31) 경고 기준: 주간 한도(legal_rate 제50조 제1항 + 제53조 제1항)까지 남은 분이 이 값 이하이면
  # 본인·부서장 화면에 '한도 근접'으로 강조한다. 법정 수치가 아니라 회사 운영 설정이다(기본 240분 = 4시간).
  attendance:
    weekly-hours-warn-remain-minutes: ${WEEKLY_HOURS_WARN_REMAIN_MINUTES:240}
  # 로그인(#76). 비밀번호가 이 횟수만큼 연속으로 틀리면 lock-duration 동안 잠근다. 법정 수치가 아니라 운영 설정이다
  # (개인정보의 안전성 확보조치 기준은 '일정 횟수 이상 인증 실패 시 접근 제한'만 요구한다, docs/auth-design.md 8장).
  # demo-password 는 개발·시연용 데모 계정(DemoAccountSeeder) 비밀번호다. 운영에서는 비워 둔다.
  auth:
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lock-duration: ${AUTH_LOCK_DURATION:30m}
    demo-password: ${DEMO_ACCOUNT_PASSWORD:}
