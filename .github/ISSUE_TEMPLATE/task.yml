name: 작업
description: 에이전트가 처리할 작업 단위
labels: ["ready"]
body:
  - type: dropdown
    id: module
    attributes:
      label: 모듈
      options: [기반, 인사·조직, 근태, 급여, 평가, 복리후생, 교육, 채용]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 무엇을 만드는지 한두 문장
    validations:
      required: true
  - type: textarea
    id: law
    attributes:
      label: 관련 법령 조문
      description: "예: 근로기준법 제60조(연차 유급휴가). 없으면 '없음'"
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 체크리스트로 작성
      value: |
        - [ ]
        - [ ] 테스트 추가 및 통과
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: 테스트 케이스 / 정답 출처
      description: "예: tests/legal-fixtures/annual-leave.json (고용노동부 연차 계산기로 검증)"
