name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 프론트엔드 위치 찾기
        id: find
        run: |
          if [ -f frontend/package.json ]; then echo "dir=frontend" >> "$GITHUB_OUTPUT";
          elif [ -f package.json ]; then echo "dir=." >> "$GITHUB_OUTPUT";
          else echo "dir=" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.find.outputs.dir != ''
        with:
          node-version: 20
      - name: 설치·린트·테스트·빌드
        if: steps.find.outputs.dir != ''
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint --if-present
          npm run typecheck --if-present
          npm test --if-present
          npm run build --if-present

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: ci-only-password
          APP_USER: glass_ehr
          APP_USER_PASSWORD: ci-only-password
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: 빌드·테스트 (Oracle 통합 테스트 포함)
        run: mvn -B verify
        env:
          ORACLE_IT: "true"
          DB_URL: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
          DB_USER: glass_ehr
          DB_PASSWORD: ci-only-password
      - name: 실패 시 테스트 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
